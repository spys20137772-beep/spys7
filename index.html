<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/-/cloud-sync.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PIXEL HOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: 8비트 오락실, 신나고 쫀득한
   IDEA: 뒤에서 따라가는 레트로 3D 플랫포머 (낮은 해상도 도트 렌더)
   PICTURE: 게임 화면 자체
   COLOUR and TYPE: 짙은 남보라 패널, 노랑 강조, Press Start 2P + 굵은 고딕
   LAYOUT: 캔버스 가득, 메뉴는 도트 패널 */
:root{--bg:#141026;--pan:#231a3d;--ink:#fff4e0;--yel:#ffd23f;--mint:#3ee0b0;--dim:#8f86b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:5}
.scr.on{display:flex}
.dim{background:rgba(10,6,24,.72)}
.logo{font-family:"Press Start 2P",monospace;font-size:clamp(28px,7vw,54px);color:var(--yel);text-shadow:4px 4px 0 #b3361f,8px 8px 0 #2a0f3a;letter-spacing:2px;text-align:center;line-height:1.1}
.logo small{display:block;font-size:.38em;color:var(--mint);text-shadow:3px 3px 0 #0b5b48;margin-top:10px}
.sub{font-weight:800;opacity:.9;font-size:15px;margin-top:-4px;text-shadow:2px 2px 0 #0008}
.b{font:inherit;font-weight:900;font-size:17px;color:#2a1640;background:var(--yel);border:0;padding:13px 22px;min-width:190px;min-height:48px;cursor:pointer;box-shadow:inset -4px -4px 0 #c98f00,inset 4px 4px 0 #fff3a8,0 0 0 4px #2a1640,6px 6px 0 4px #0008}
.b:active{transform:translate(3px,3px);box-shadow:inset -4px -4px 0 #c98f00,inset 4px 4px 0 #fff3a8,0 0 0 4px #2a1640,3px 3px 0 4px #0008}
.b.g{background:#7a6fb0;color:#fff;box-shadow:inset -4px -4px 0 #4f4682,inset 4px 4px 0 #a99fe0,0 0 0 4px #2a1640,6px 6px 0 4px #0008}
.b.m{background:var(--mint);box-shadow:inset -4px -4px 0 #1f9d78,inset 4px 4px 0 #b8ffe9,0 0 0 4px #2a1640,6px 6px 0 4px #0008}
.b.s{min-width:0;padding:10px 14px;font-size:15px}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.panel{background:var(--pan);padding:18px;box-shadow:0 0 0 4px #0c0818,0 0 0 8px #4b3d7a,10px 10px 0 8px #0008;max-width:min(680px,94vw);max-height:84vh;overflow:auto;touch-action:pan-y}
.h{font-family:"Press Start 2P",monospace;color:var(--yel);font-size:16px;text-align:center;margin:0 0 14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:#352a5c;border:0;color:var(--ink);font:inherit;padding:10px 6px;cursor:pointer;box-shadow:inset -3px -3px 0 #221a40,inset 3px 3px 0 #5a4d8f;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.st .n{font-family:"Press Start 2P",monospace;font-size:18px;color:var(--yel)}
.st .t{font-size:12px;font-weight:800;opacity:.9}
.st .s{font-size:14px;letter-spacing:1px;color:var(--yel)}
.st .tm{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.st.lock{opacity:.4;cursor:default}
.st.lock .n{color:var(--dim)}
.skin{background:#352a5c;border:0;color:var(--ink);font:inherit;padding:8px;cursor:pointer;box-shadow:inset -3px -3px 0 #221a40,inset 3px 3px 0 #5a4d8f;display:flex;flex-direction:column;align-items:center;gap:4px}
.skin canvas{width:48px;height:60px;image-rendering:pixelated}
.skin .t{font-weight:800;font-size:13px}
.skin .p{font-size:12px;color:var(--yel);font-weight:800}
.skin.sel{box-shadow:inset 0 0 0 3px var(--yel)}
.coinbar{font-weight:900;color:var(--yel);font-size:16px;text-shadow:2px 2px 0 #0008}
.big{font-family:"Press Start 2P",monospace;font-size:clamp(22px,6vw,34px);color:var(--yel);text-shadow:4px 4px 0 #b3361f;text-align:center}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.stats span:nth-child(odd){opacity:.7}
.stars{font-size:34px;letter-spacing:6px;color:var(--yel);text-shadow:3px 3px 0 #0008}
.stars i{font-style:normal;color:#4b3d7a}
.newrec{color:var(--mint);font-weight:900;font-size:15px}
#hud{position:fixed;inset:0;z-index:4;display:none;pointer-events:none;font-family:"Press Start 2P",monospace;color:var(--ink);text-shadow:2px 2px 0 #1a0f22}
#hud.on{display:block}
#hL{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));font-size:13px;line-height:1.9}
#hL .c{color:var(--yel)}
#hL .sr{letter-spacing:3px;font-size:14px}
#hL .sr i{font-style:normal;color:#4b3d7a}
#hC{position:absolute;left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));text-align:center;font-size:13px;line-height:1.8}
#hC .bg{font-size:20px}
#hC .sm{font-size:9px;color:#c9c0f0}
#hView{pointer-events:auto;position:absolute;right:calc(max(8px,env(safe-area-inset-right)) + 52px);top:max(8px,env(safe-area-inset-top));width:44px;height:44px;background:#0007;border:0;color:#fff;font-size:13px;font-weight:900;box-shadow:inset 0 0 0 3px #3ee0b099;cursor:pointer;font-family:system-ui,sans-serif}
#hPause{pointer-events:auto;position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:44px;height:44px;background:#0007;border:0;color:#fff;font-size:16px;font-weight:900;box-shadow:inset 0 0 0 3px #fff5;cursor:pointer;font-family:inherit}
#ctl{position:fixed;left:0;right:0;bottom:0;z-index:3;display:none;pointer-events:none;padding:0 max(18px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
#ctl.on{display:flex;justify-content:space-between;align-items:flex-end}
#joy{pointer-events:auto;position:relative;width:clamp(120px,30vw,150px);height:clamp(120px,30vw,150px);border-radius:50%;background:#0004;box-shadow:inset 0 0 0 3px #fff3;touch-action:none}
#joy .ar{position:absolute;color:#fff8;font-size:15px;line-height:1}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:#fff5;box-shadow:inset 0 0 0 3px #fff8}
#btns{display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
.cb{width:clamp(72px,18vw,92px);height:clamp(72px,18vw,92px);border-radius:50%;background:#ff4d6d55;box-shadow:inset 0 0 0 3px #fff4;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fffc;font-size:16px;touch-action:none}
.cb.on{filter:brightness(1.6)}
#bPound{width:clamp(58px,14vw,74px);height:clamp(58px,14vw,74px);background:#ff6b4a55;display:none;margin-bottom:40px}
#bDash{width:clamp(58px,14vw,74px);height:clamp(58px,14vw,74px);background:#ffb70355;display:none;margin-bottom:40px}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center;opacity:0;transition:opacity .3s;width:90vw}
#toast.on{opacity:1}
#toast .a{font-family:"Press Start 2P",monospace;color:var(--yel);font-size:clamp(14px,3.6vw,20px);text-shadow:3px 3px 0 #000;line-height:1.5}
#toast .b2{font-weight:900;font-size:15px;text-shadow:2px 2px 0 #000;margin-top:6px}
.tg{display:flex;gap:10px}
.small{font-size:13px;opacity:.8;text-align:center;max-width:440px;line-height:1.5;text-shadow:1px 1px 0 #0008}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9;background:var(--bg);font-weight:800;line-height:1.6}
.wh{grid-column:1/-1;font-family:"Press Start 2P",monospace;font-size:12px;color:var(--mint);margin:6px 0 -2px}
.st.boss{background:#5c2a3a;box-shadow:inset -3px -3px 0 #3a1622,inset 3px 3px 0 #8f4a5e}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:#352a5c;padding:10px 12px;box-shadow:inset -3px -3px 0 #221a40,inset 3px 3px 0 #5a4d8f}
.up b{font-size:15px}.up span{font-size:12px;opacity:.8;grid-column:1}.up button{grid-row:1/3;grid-column:2}
.ups{display:grid;gap:10px;margin-bottom:16px}
.ach{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:#352a5c;padding:10px 12px;box-shadow:inset -3px -3px 0 #221a40,inset 3px 3px 0 #5a4d8f}
.ach .i{grid-row:1/3;font-size:22px;color:#4b3d7a}.ach.done .i{color:var(--yel)}.ach b{font-size:15px}.ach span{font-size:12px;opacity:.8}.ach em{grid-row:1/3;grid-column:3;font-style:normal;color:var(--yel);font-weight:900;font-size:13px;text-align:right}
.achs{display:grid;gap:8px;min-width:min(520px,86vw)}
.sh2{font-family:"Press Start 2P",monospace;font-size:12px;color:var(--mint);margin:4px 0 10px}
@media (max-height:520px){.logo{font-size:30px;text-shadow:3px 3px 0 #b3361f,6px 6px 0 #2a0f3a}.logo small{margin-top:6px}.scr{gap:10px}.b{min-width:160px;min-height:44px;padding:10px 16px}.panel{max-height:90vh;padding:14px}.st{min-height:80px}.big{font-size:22px}.stars{font-size:26px}.stats{font-size:14px;gap:2px 18px}#sClear .panel,#sOver .panel{gap:8px!important}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="sMenu" class="scr on">
  <div class="logo">PIXEL HOP<small>3D</small></div>
  <div class="sub">픽셀 홉 · 뒤에서 따라가는 도트 플랫포머</div>
  <div class="coinbar" id="mCoins"></div>
  <div class="row" style="gap:18px"><button class="b" id="goStage">스테이지</button>
  <button class="b m" id="goEndless">무한 모드</button>
  <button class="b g" id="goSkin">상점</button>
  <button class="b g" id="goAch">도전 과제</button></div>
  <div class="tg"><button class="b g s" id="tMusic">음악 ON</button><button class="b g s" id="tSfx">효과음 ON</button><button class="b g s" id="tGfx">화질: 선명</button></div>
  <div class="small" id="keyHint">PC: WASD/방향키 이동 · 스페이스 점프 · Shift 대시 · F 내려찍기 · V 시점 바꾸기 · 마우스 드래그/Q·E 회전 · 휠 확대 · Esc 일시정지 · R 재시작</div>
</div>
<div id="sStage" class="scr dim"><div class="panel"><div class="h">STAGE SELECT</div><div class="grid" id="stGrid"></div><div class="small" id="abInfo" style="margin:14px auto 4px"></div><div class="row" style="margin-top:12px"><button class="b g s" data-back>뒤로</button></div></div></div>
<div id="sSkin" class="scr dim"><div class="panel"><div class="h">SHOP</div><div class="coinbar" id="sCoins" style="text-align:center;margin-bottom:12px"></div><div class="sh2">강화</div><div class="ups" id="upList"></div><div class="sh2">스킨</div><div class="grid" id="skGrid"></div><div class="row" style="margin-top:14px"><button class="b g s" data-back>뒤로</button></div></div></div>
<div id="sAch" class="scr dim"><div class="panel"><div class="h">도전 과제</div><div class="achs" id="achList"></div><div class="row" style="margin-top:14px"><button class="b g s" data-back>뒤로</button></div></div></div>
<div id="sPause" class="scr dim"><div class="big">PAUSE</div><button class="b" id="pRes">계속하기</button><button class="b g" id="pRetry">다시 시작</button><button class="b g" id="pMenu">메뉴로</button></div>
<div id="sClear" class="scr dim"><div class="panel" style="display:flex;flex-direction:column;align-items:center;gap:12px"><div class="big">CLEAR!</div><div class="stars" id="cStars"></div><div class="newrec" id="cRec"></div><div class="stats" id="cStats"></div><div class="row" style="align-items:center"><button class="b" id="cNext">다음 스테이지</button><button class="b g s" id="cRetry">다시 하기</button><button class="b g s" id="cMenu">메뉴</button></div></div></div>
<div id="sOver" class="scr dim"><div class="panel" style="display:flex;flex-direction:column;align-items:center;gap:12px"><div class="big">GAME OVER</div><div class="newrec" id="oRec"></div><div class="stats" id="oStats"></div><div class="row"><button class="b m" id="oRetry">다시 달리기</button><button class="b g s" id="oMenu">메뉴</button></div></div></div>

<div id="hud"><div id="hL"></div><div id="hC"></div><button id="hView" class="hbtn">뒤</button><button id="hPause">II</button></div>
<div id="ctl">
  <div id="joy"><span class="ar" style="left:50%;top:7%;transform:translateX(-50%)">▲</span><span class="ar" style="left:50%;bottom:7%;transform:translateX(-50%)">▼</span><span class="ar" style="left:7%;top:50%;transform:translateY(-50%)">◀</span><span class="ar" style="right:7%;top:50%;transform:translateY(-50%)">▶</span><div id="knob"></div></div>
  <div id="btns"><div class="cb" id="bPound">쾅</div><div class="cb" id="bDash">대시</div><div class="cb" id="bJump">점프</div></div>
</div>
<div id="toast"><div class="a" id="tA"></div><div class="b2" id="tB"></div></div>
<div id="err">이 기기에서 3D 화면을 열 수 없어요. 다른 브라우저로 열어주세요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('err').style.display='flex';throw new Error('no three');}
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const lerp=(a,b,t)=>a+(b-a)*t;
function seeded(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;}}
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const OL='#1a0f22';

// ================= 저장 =================
const SKEY='pixelhop3d_v1';
const defSave={gfx:'hd',view:0,unlocked:0,stars:[],best:[],ab:{dj:false,wj:false,dash:false,glide:false,hook:false,pound:false,run:false},up:{},shield:0,secrets:[],ach:[],stats:{kills:0,earned:0},coins:0,skins:['basic'],skin:'basic',bestDist:0,music:true,sfx:true};
let save;
try{save=Object.assign({},defSave,JSON.parse(localStorage.getItem(SKEY)||'{}'));save.ab=Object.assign({},defSave.ab,save.ab||{});save.up=save.up||{};save.stats=Object.assign({kills:0,earned:0},save.stats||{});save.secrets=save.secrets||[];save.ach=save.ach||[];}catch(e){save=JSON.parse(JSON.stringify(defSave));}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}

// ================= 오디오 =================
let AC=null,master,musicG,sfxG,noiseBuf,pulse25,pulse12;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  musicG=AC.createGain();musicG.gain.value=save.music?0.5:0;musicG.connect(master);
  sfxG=AC.createGain();sfxG.gain.value=save.sfx?0.8:0;sfxG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const mk=duty=>{const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let n=1;n<N;n++)re[n]=2*Math.sin(Math.PI*n*duty)/(Math.PI*n);return AC.createPeriodicWave(re,im);};
  pulse25=mk(0.25);pulse12=mk(0.125);
}
function tone(f,dur,o={}){if(!AC)return;const t=(o.at||AC.currentTime);const os=AC.createOscillator(),g=AC.createGain();
  if(o.wave)os.setPeriodicWave(o.wave);else os.type=o.type||'square';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  const v=o.vol==null?0.15:o.vol;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);os.connect(g);g.connect(o.bus||sfxG);os.start(t);os.stop(t+dur+0.02);}
function noise(dur,o={}){if(!AC)return;const t=(o.at||AC.currentTime);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=o.ft||'lowpass';f.frequency.setValueAtTime(o.f||2000,t);
  if(o.fto)f.frequency.exponentialRampToValueAtTime(o.fto,t+dur);const g=AC.createGain();const v=o.vol==null?0.15:o.vol;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  s.connect(f);f.connect(g);g.connect(o.bus||sfxG);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);}
const SFX={
  jump(){tone(280,0.14,{to:620,wave:pulse25,vol:0.11});},
  dj(){tone(480,0.16,{to:1000,wave:pulse25,vol:0.1});tone(720,0.1,{to:1400,type:'triangle',vol:0.08});},
  wj(){tone(360,0.12,{to:760,wave:pulse25,vol:0.1});noise(0.06,{f:3000,vol:0.06});},
  land(){noise(0.06,{f:700,vol:0.12});},
  coin(){const t=AC.currentTime;tone(988,0.07,{wave:pulse25,vol:0.08,at:t});tone(1319,0.16,{wave:pulse25,vol:0.08,at:t+0.07});},
  star(){const t=AC.currentTime;[784,988,1175,1568].forEach((f,i)=>tone(f,0.14,{wave:pulse25,vol:0.09,at:t+i*0.06}));},
  die(){tone(640,0.45,{to:60,type:'square',vol:0.12});noise(0.3,{f:1500,fto:200,vol:0.15});},
  dash(){noise(0.18,{ft:'bandpass',f:800,fto:4000,vol:0.2});tone(200,0.12,{to:90,type:'sawtooth',vol:0.05});},
  spring(){tone(180,0.3,{to:1100,type:'triangle',vol:0.18});tone(360,0.2,{to:1500,wave:pulse12,vol:0.05});},
  stomp(){tone(320,0.14,{to:90,wave:pulse25,vol:0.12});noise(0.08,{f:1200,vol:0.12});},
  cp(){const t=AC.currentTime;tone(660,0.1,{wave:pulse25,vol:0.09,at:t});tone(880,0.1,{wave:pulse25,vol:0.09,at:t+0.09});tone(1320,0.2,{wave:pulse25,vol:0.09,at:t+0.18});},
  crumble(){noise(0.18,{f:500,fto:120,vol:0.14});},
  orb(){const t=AC.currentTime;[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.18,{wave:pulse25,vol:0.08,at:t+i*0.07}));},
  clear(){const t=AC.currentTime;[[523,0],[659,.1],[784,.2],[1047,.3],[784,.45],[1047,.55]].forEach(([f,d])=>tone(f,0.22,{wave:pulse25,vol:0.1,at:t+d}));tone(262,0.8,{type:'triangle',vol:0.15,at:t+0.3});},
  click(){tone(900,0.04,{wave:pulse25,vol:0.06});},
  buy(){const t=AC.currentTime;tone(1047,0.08,{wave:pulse25,vol:0.08,at:t});tone(1568,0.2,{wave:pulse25,vol:0.08,at:t+0.08});},
  roll(){noise(0.12,{f:300,vol:0.08});}
};
let quiet=false;

const mf=m=>440*Math.pow(2,(m-69)/12);

const W=7,T_PIT=0,T_G=1,T_BR=2,T_CR=3,T_SPK=4,T_TSPK=5,T_ICE=6,T_LAVA=7,T_BNC=8,T_INV=9,T_BRG=10,BOTTOM=-6;
let UID=1;
function newLevel(n,theme,name){return{n,theme,name,h:new Int8Array(n*W),type:new Uint8Array(n*W),ents:[],cr:new Map(),crCells:[],spikeCells:[],rev:new Set(),bridgeOn:false,lavaY:null,lavaSpd:0,spawn:{x:3.5,f:1.5,y:1},built:new Set(),rows:0};}
function addEnt(L,e){e.uid=UID++;L.ents.push(e);return e;}
function setRow(L,f,str){
  const H=parseInt(str[0],10),pat=str.slice(1,8),cmd=str.length>9&&str[8]===';'?str.slice(9).trim():'';const lavaRow=pat.includes('L');
  if(pat.length!==7)throw new Error('bad row '+f+': '+str);
  const slimes=[];
  for(let x=0;x<7;x++){const ch=pat[x],i=f*W+x;let t=T_G,h=H;
    switch(ch){
      case '.':case 'O':case '%':t=T_PIT;break;
      case '+':h=H+1;break;case '-':h=H-1;break;case '=':h=H+2;break;
      case 'W':t=T_BR;h=H+6;break;case 'B':t=T_BR;break;
      case '^':t=T_SPK;break;case '*':t=T_TSPK;break;case 'c':t=T_CR;break;
      case 'I':t=T_ICE;break;case 'L':t=T_LAVA;break;case 'j':t=T_BNC;break;case 'b':t=T_BRG;break;case 'R':t=T_PIT;break;
      case '1':case '2':case '3':case '4':t=T_INV;h=H+(+ch);break;case 'T':t=T_BR;h=H+5;break;
    }
    if(lavaRow&&t===T_PIT)t=T_LAVA;
    L.type[i]=t;L.h[i]=h;
    if(t===T_CR)L.crCells.push(i);

    if(ch==='o')addEnt(L,{k:'coin',x:cx,f:cf,y:H+0.55});
    if(ch==='q')addEnt(L,{k:'coin',x:cx,f:cf,y:H+1.9});
    if(ch==='O')addEnt(L,{k:'coin',x:cx,f:cf,y:H+1.3});
    if(ch==='$')addEnt(L,{k:'star',x:cx,f:cf,y:H+1.8});
    if(ch==='%')addEnt(L,{k:'star',x:cx,f:cf,y:H+1.4});
    if(ch==='e')slimes.push(x);
    if('DJHGYVU'.includes(ch))addEnt(L,{k:'orb',ab:{D:'dj',J:'wj',H:'dash',G:'glide',Y:'hook',V:'pound',U:'run'}[ch],x:cx,f:cf,y:H+0.6});
    if(ch==='R'||ch==='r')addEnt(L,{k:'ring',x:cx,f:cf,y:H+2.6});
    if(ch==='X')addEnt(L,{k:'switch',x:cx,f:cf,y:H,on:false});
    if(ch==='T')addEnt(L,{k:'chest',x:cx,f:cf,y:H+5,open:false});
    if(ch==='E')slimes.push(-1-x);
    if(ch==='k')addEnt(L,{k:'king',x:cx,f:cf,y:H,gy:H,hp:3,vx:0,vf:0,vy:0,t:1.6,onG:true,inv:0,n:0,minF:f-4,maxF:f+4.5});
    if(ch==='g')addEnt(L,{k:'golem',x:cx,f:cf,y:H,hp:3,st:'throw',t:1.6,n:0,inv:0});
    if(ch==='K')addEnt(L,{k:'cp',x:cx,f:cf,y:H,on:false});
    if(ch==='F')addEnt(L,{k:'flag',x:cx,f:cf,y:H});
    if(ch==='S')addEnt(L,{k:'spring',x:cx,f:cf,y:H,t:0});
    if(ch==='P')L.spawn={x:cx,f:cf,y:H};
  }
  for(let x of slimes){const armor=x<0;if(armor)x=-1-x;let a=x,b=x;const ok=c=>c>=0&&c<7&&(L.type[f*W+c]===T_G||L.type[f*W+c]===T_ICE)&&L.h[f*W+c]===L.h[f*W+x];while(ok(a-1))a--;while(ok(b+1))b++;
    addEnt(L,{k:'slime',armor,x:x+0.5,f:f+0.5,y:L.h[f*W+x],a:a+0.35,b:b+0.65,dir:1,spd:armor?1.2:1.6,dead:false});}
  if(cmd){const p=cmd.split(/\s+/),c=p[0],n=p.slice(1).map(Number);
    if(c==='mx')addEnt(L,{k:'mover',x0:n[0]+0.5,f0:f+0.5,y0:H,ax:n[1]-n[0],af:0,ay:0,spd:n[2]||1.5,ph:0});
    if(c==='mf')addEnt(L,{k:'mover',x0:n[0]+0.5,f0:f+0.5,y0:H,ax:0,af:n[1],ay:0,spd:n[2]||1.3,ph:0});
    if(c==='my')addEnt(L,{k:'mover',x0:n[0]+0.5,f0:f+0.5,y0:H,ax:0,af:0,ay:n[1],spd:n[2]||1.3,ph:0});
    if(c==='log')addEnt(L,{k:'logsp',f:f+0.5,y:H,iv:n[0]||2,len:n[1]||8,t:(n[0]||2)*0.6});
    if(c==='lava'){L.lavaSpd=n[0]||0.5;L.lavaY=n[1]==null?-3:n[1];L.lava0=L.lavaY;}
  }
  for(const e of L.ents)if(e.k==='mover'&&e.x==null){e.x=e.x0;e.f=e.f0;e.y=e.y0;e.dx=0;e.df=0;e.dy=0;}
  L.rows=Math.max(L.rows,f+1);
}
function parseStage(spec){
  const rows=[];const raw=[];for(const s of spec.rows)raw.push(s);
  for(const s of raw){const m=/^(\d+):(.*)$/.exec(s);if(m){for(let i=0;i<+m[1];i++)rows.push(i<+m[1]-1?m[2].split(';')[0]:m[2]);}else rows.push(s);}
  if(!spec.boss){const fi=rows.findIndex(r=>r.slice(1,8).includes('F'));if(fi>0){const H=rows[fi][0];rows.splice(fi,0,H+'#####2.',H+'#####.4',H+'#####.T');}}
  const L=newLevel(rows.length,spec.theme,spec.name);L.boss=!!spec.boss;rows.forEach((r,f)=>setRow(L,f,r));
  let si=0;for(const e of L.ents)if(e.k==='star')e.id=si++;
  if(L.spawn.f===1.5){L.spawn.y=L.h[1*W+3];}
  return L;
}

function makeEndless(){const L=newLevel(5000,'grass','endless');L.endless=true;L.genH=1;for(let f=0;f<10;f++)setRow(L,f,'1#######');L.genF=10;L.spawn={x:3.5,f:2.5,y:1};return L;}
function genMore(L,upTo){
  const ab=save.ab,rows=[];
  while(L.genF<upTo&&L.genF<L.n-30){
    let h=L.genH;const d=Math.min(1,L.genF/300);const R=[];
    const fl=(n,p)=>{for(let i=0;i<n;i++)R.push(h+(p||'#######'));};
    const roll=Math.random();
    const maxGap=Math.min(2+(ab.dj?2:0)+(ab.dash?1:0),1+Math.floor(d*(3+(ab.dj?2:0)+(ab.dash?1:0))));
    if(roll<0.2){const n=ri(3,6);for(let i=0;i<n;i++){let p='#######'.split('');if(Math.random()<0.35)p[ri(0,6)]='o';if(i===2&&Math.random()<0.25+d*0.4)p[ri(1,5)]='e';R.push(h+p.join(''));}}
    else if(roll<0.4){const g=ri(1,Math.max(1,maxGap));for(let i=0;i<g;i++)R.push(h+(i===Math.floor(g/2)&&Math.random()<0.5?'...O...':'.......'));
      let nh=clamp(h+ri(-1,1),1,6);if(nh>h&&g>2&&!ab.dj)nh=h;h=nh;fl(ri(2,4));}
    else if(roll<0.5){const up=Math.random()<0.6&&h<6;h=clamp(h+(up?1:-1),1,6);fl(2);if(Math.random()<0.5&&h<6){h++;fl(2);}}
    else if(roll<0.6){let c=3;for(let i=0;i<ri(3,5);i++){R.push(h+'.......');const p='.......'.split('');c=clamp(c+ri(-2,2),0,6);p[c]=Math.random()<0.3?'o':'#';R.push(h+p.join(''));}fl(2);}
    else if(roll<0.68){const lane=ri(0,6);for(let i=0;i<ri(2,3);i++){const p='#######'.split('').map((_,x)=>x===lane||Math.random()<0.4-d*0.2?'#':'^');p[lane]='#';R.push(h+p.join(''));R.push(h+'#######');}}
    else if(roll<0.74){fl(1);R.push(h+'*******');fl(1);if(d>0.3){R.push(h+'*******');fl(1);}}
    else if(roll<0.82){const n=ri(3,6);for(let i=0;i<n;i++)R.push(h+(i%2?'ccocccc':'ccccccc'));fl(1);}
    else if(roll<0.88){R.push(h+'.......');R.push(h+'.......;mx 0 6 '+(1.8+d).toFixed(1));R.push(h+'.......');fl(2);}
    else if(roll<0.94){fl(1);const n=ri(5,7);for(let i=0;i<n;i++)R.push(h+(i===n-1?'#######;log '+(2.2-d*0.6).toFixed(1)+' '+n:'#######'));fl(1);}
    else{if(h>4){fl(2);}else{R.push(h+'###S###');h+=4;fl(3);}}
    for(const r of R){setRow(L,L.genF,r);L.genF++;}L.genH=h;
  }
}

  for(let cf=f0;cf<=f1;cf++)for(let cx=x0;cx<=x1;cx++){const t=topAt(cx,cf);if(t>m)m=t;}return m;}
function moveAxis(p,ax,d){if(!d)return false;
  if(ax==='x'){const nx=p.x+d;if(maxTop(nx,p.f)>p.y+0.02){p.x=d>0?Math.floor(nx+PR)-PR-0.0005:Math.floor(nx-PR)+1+PR+0.0005;return true;}p.x=nx;return false;}

  if(cptr.size===2){const a=[...cptr.values()];pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);dist0=camO.dist;}});
cv.addEventListener('pointermove',e=>{const o=cptr.get(e.pointerId);if(!o)return;const dx=e.clientX-o.x,dy=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;
  if(cptr.size>=2){const a=[...cptr.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch0>0)camO.dist=clamp(dist0*pinch0/d,4,18);return;}
  const sc=600/Math.max(320,innerWidth);camO.yaw-=dx*0.009*sc;camO.pitch=clamp(camO.pitch+dy*0.006*sc,0.12,1.45);});

  camera.position.set(cam.px+sx,cam.py+sy,-cam.pf);camera.lookAt(cam.lx+sx*0.5,cam.lyy,-cam.lf);
  for(const cl of clouds){const u=cl.userData;let f=u.of+cam.pf*0.3;f=((f-cam.pf)%70+70)%70+cam.pf+12;cl.position.set(u.ox+cam.px*0.5+Math.sin(t*0.05+u.ox)*2,u.oy+cam.py*0.3,-f);}
  // 파티클
  const pa=pGeo.attributes.position.array,ca=pGeo.attributes.color.array;let n=0;
  for(const q of parts){if(n>=MAXP)break;pa[n*3]=q.x;pa[n*3+1]=q.y;pa[n*3+2]=-q.f;ca[n*3]=q.c.r;ca[n*3+1]=q.c.g;ca[n*3+2]=q.c.b;n++;}

  renderer.render(scene,camera);

const keys=new Set();
function keyDir(){if(state!=='play')return;let x=0,f=0;if(keys.has('ArrowLeft')||keys.has('KeyA'))x-=1;if(keys.has('ArrowRight')||keys.has('KeyD'))x+=1;if(keys.has('ArrowUp')||keys.has('KeyW'))f+=1;if(keys.has('ArrowDown')||keys.has('KeyS'))f-=1;if(!joyId){inp.x=x;inp.f=f;}}
addEventListener('keydown',e=>{initAudio();keys.add(e.code);keyDir();
  if(['Space','KeyZ','KeyK','KeyJ'].includes(e.code)){if(!e.repeat)inp.jp=true;inp.jump=true;e.preventDefault();}
  if(['ShiftLeft','ShiftRight','KeyX','KeyL'].includes(e.code)&&!e.repeat)inp.dp=true;
  if(['KeyF','ControlLeft','KeyE2'].includes(e.code)&&!e.repeat)inp.pp=true;
  if(e.code.startsWith('Arrow'))e.preventDefault();
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')pause();else if(state==='pause')resume();}
  if((e.code==='KeyV'||e.code==='KeyC')&&state==='play')switchView();
  if(state==='play'&&(e.code==='KeyQ'||e.code==='KeyE')){camO.yaw+=(e.code==='KeyQ'?0.3:-0.3);saveCam();}
  if(state==='play'&&(e.code==='KeyR'&&false)){}
  if(e.code==='KeyR'&&state==='play'){mode==='endless'?startEndless():startStage(stageIdx);}
  if(e.code==='Enter'){if(state==='clear'&&stageIdx<STAGES.length-1)startStage(stageIdx+1);else if(state==='over')startEndless();}});
addEventListener('keyup',e=>{keys.delete(e.code);keyDir();if(['Space','KeyZ','KeyK','KeyJ'].includes(e.code))inp.jump=false;});
const joy=$('joy'),knob=$('knob');let joyId=0;
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,rad=r.width/2;let dx=(e.clientX-cx)/rad,dy=(e.clientY-cy)/rad;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
  knob.style.transform=`translate(${dx*rad*0.55}px,${dy*rad*0.55}px)`;const dl=Math.hypot(dx,dy);if(dl<0.22){inp.x=0;inp.f=0;}else{const k=Math.min(1,(dl-0.22)/0.55)/dl;inp.x=dx*k;inp.f=-dy*k;}}
joy.addEventListener('pointerdown',e=>{initAudio();e.preventDefault();joyId=e.pointerId;try{joy.setPointerCapture(e.pointerId);}catch(_){}joyMove(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e);});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>joy.addEventListener(t,e=>{if(e.pointerId!==joyId)return;joyId=0;inp.x=0;inp.f=0;knob.style.transform='';}));
function holdBtn(el,down,up){const ids=new Set();el.addEventListener('pointerdown',e=>{initAudio();e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}ids.add(e.pointerId);el.classList.add('on');down();});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,e=>{if(!ids.delete(e.pointerId))return;if(!ids.size){el.classList.remove('on');up();}}));}
holdBtn($('bJump'),()=>{inp.jp=true;inp.jump=true;},()=>{inp.jump=false;});holdBtn($('bDash'),()=>{inp.dp=true;},()=>{});holdBtn($('bPound'),()=>{inp.pp=true;},()=>{});

// ================= 크기 =================
function resize(){const Wd=innerWidth,Hd=innerHeight,asp=Wd/Hd;
  if(save.gfx!=='px'){const pr=Math.min(window.devicePixelRatio||1,2);renderer.setPixelRatio(pr);renderer.setSize(Wd,Hd,false);RW=Wd;RH=Hd;camera.aspect=asp;camera.updateProjectionMatrix();
    cv.style.width=Wd+'px';cv.style.height=Hd+'px';cv.style.left='0px';cv.style.top='0px';cv.style.imageRendering='auto';pts.material.size=0.08;return;}
  renderer.setPixelRatio(1);cv.style.imageRendering='';pts.material.size=0.11;
  RH=200;RW=clamp(Math.round(RH*asp),240,440);if(asp<1){RW=240;RH=clamp(Math.round(240/Math.max(asp,0.45)),200,420);}
  renderer.setSize(RW,RH,false);camera.aspect=RW/RH;camera.updateProjectionMatrix();
  const sc=Math.min(Wd/RW,Hd/RH),cw=RW*sc,ch=RH*sc;cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=((Wd-cw)/2)+'px';cv.style.top=((Hd-ch)/2)+'px';}
addEventListener('resize',resize);resize();

// ================= 루프 =================
let last=performance.now(),acc=0,rtime=0;const STEP=1/60;
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.1)dt=0.1;rtime+=dt;
  if(state==='play'||state==='menu'){acc+=dt;while(acc>=STEP){if(state==='menu'){demoAI();quiet=true;update(STEP);quiet=false;}else update(STEP);acc-=STEP;}}else acc=0;
  updateParts(dt);shake=Math.max(0,shake-dt);
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on');}
  if(state!=='menu')drawHUD();
  render(rtime,dt);requestAnimationFrame(loop);}
startDemo();refreshMenu();requestAnimationFrame(loop);

window.__G={get P(){return P},get L(){return L},get state(){return state},inp,save,startStage,startEndless,update,STAGES,
  snap(){return{P:JSON.stringify(P),E:JSON.stringify(L.ents),C:[...L.cr],ch:chase?{...chase}:null,rt:runTime,mx:maxF,gt:gtime,uid:UID,lv:L.lavaY,br:L.bridgeOn,rev:[...L.rev]};},
  restore(o){const cur=L.ents.filter(e=>e.uid>=o.uid&&e.k!=='log');L.ents=JSON.parse(o.E).concat(cur);P=JSON.parse(o.P);L.cr=new Map(o.C);chase=o.ch?{...o.ch}:null;runTime=o.rt;L.lavaY=o.lv;L.bridgeOn=o.br;L.rev=new Set(o.rev);maxF=o.mx;gtime=o.gt;parts=[];},
  setState(s){state=s;}};
}
</script>
